<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Trackfit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">

<body>
  <main id="app" class="container" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home"><span aria-hidden="true">🏋️</span>Workouts</a>
    <a href="#/history" data-tab="history"><span aria-hidden="true">📅</span>History</a>
    <a href="#/progress" data-tab="progress"><span aria-hidden="true">📈</span>Progress</a>
